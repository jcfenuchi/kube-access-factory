{{- range $ns := .Values.namespaces }}
{{- if $ns.create }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns.name | quote }}
  labels:
    {{- include "kubeconfig-factory.labels" $ | nindent 4 }}
    {{- with $ns.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $ns.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
