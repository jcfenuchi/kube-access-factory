{{- range $group := .Values.groups }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $group.name | quote }}
  namespace: {{ if eq $group.scope "cluster" }}"kube-system"{{ else }}{{ $group.namespace | quote }}{{ end }}
  labels:
    {{- include "kubeconfig-factory.labels" $ | nindent 4 }}
    app.kubernetes.io/component: "serviceaccount"
    kubeconfig-factory/group: {{ $group.name | quote }}
    kubeconfig-factory/scope: {{ $group.scope | quote }}
    kubeconfig-factory/role: {{ $group.role | quote }}
{{- end }}
